name: Update website

on:
  schedule:
    - cron: "17 5 * * *" # every morning, after TED's daily publication
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from TED
        run: python site/build.py --out docs
      - name: Publish
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git config user.name "${{ github.repository_owner }}"
            git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
            git add docs
            git commit -m "Daily tender update"
            git push
          fi
